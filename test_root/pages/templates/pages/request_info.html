{% extends "base.html" %}

{% block main_content %}

<h1>Request Further Information</h1>

{% if submitted %}
<p>Your request has been sent successfully.</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <label>Name:</label>
    <input type="text" name="name" required>

    <br><br>

    <label>Email:</label>
    <input type="email" name="email" required>

    <br><br>

    <label>Topic:</label>
    <select name="topic">
        <option>Ghost Gear</option>
        <option>Marine Pollution</option>
        <option>Overfishing</option>
    </select>

    <br><br>

    <label>Message:</label><br>
    <textarea name="message"></textarea>

    <br><br>

    <button type="submit">Send Request</button>

</form>

{% endblock %}
